<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>m4a-web</title>
    <style>
    :root {
      color-scheme: light dark;
      /* 目が疲れにくいように、ダークモードの文字は白でなく少し暗い灰色にする */
      --text: light-dark(#333b3c, #d0d0d0);
      --link: light-dark(#2f55c9, #8ea6e6);
      --line: light-dark(#cfcac3, #444444);
      --selected: light-dark(#cfd8ff, #3a4470);
      /* 英数字と日本語で字形がそろうように、フォントを具体的に指定する */
      --font-sans: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", monospace;
    }
    html,
    body {
      height: 100%;
      margin: 0;
    }
    body {
      color: var(--text);
      background-color: light-dark(#efedea, #282828);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.6;
      overflow: hidden;
    }
    a {
      color: var(--link);
    }
    button,
    input,
    select {
      font-family: inherit;
      font-size: 15px;
    }
    /* 画面の高さに収める: 上の部分は固定し、一覧と本文はそれぞれスクロールする */
    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .app-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 16px;
      padding: 6px 12px;
      border-bottom: 1px solid var(--line);
    }
    .app-header h1 {
      font-size: 18px;
      margin: 0 auto 0 0; /* タイトル以外は右に寄せる */
    }
    .app-header h1 a {
      color: inherit;
      text-decoration: none;
    }
    .message {
      padding: 0 12px;
    }
    .engine-bar {
      padding: 8px 12px 0;
      border-bottom: 1px solid var(--line);
    }
    .engine-bar p {
      margin: 4px 0 8px;
      font-size: 14px;
    }
    .viewer {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 1em;
    }
    .song-list {
      list-style: none;
      margin: 0;
      padding: 8px 0 0;
      flex-shrink: 0;
      overflow-y: auto;
      white-space: nowrap;
      line-height: 1.4;
      font-family: var(--font-mono);
      border-right: 1px solid light-dark(#dcd7d0, #3a3a3a);
    }
    .song-list li {
      padding: 2px 4px 2px 12px;
    }
    .song-list li.selected {
      background: var(--selected);
    }
    .song-list a {
      color: inherit;
      text-decoration: none;
      display: block;
      padding-right: 8px;
    }
    .song-view {
      flex: 1;
      min-width: 0;
      overflow: auto;
      padding: 0 12px 24px 0;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5em 1em;
      align-items: center;
    }
    .controls + .controls {
      margin-top: 0.5em;
    }
    .controls input[type="number"] {
      width: 4em;
    }
    .stepper {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }
    .seek input[type="range"] {
      flex: 1;
      max-width: 480px;
    }
    .info-table {
      margin-top: 1em;
      border-collapse: collapse;
      font-family: var(--font-mono);
      line-height: 1.4;
    }
    .info-table th,
    .info-table td {
      padding: 1px 8px;
      text-align: left;
    }
    .info-table th {
      white-space: nowrap;
      vertical-align: top;
    }
    .mono {
      font-family: var(--font-mono);
    }
    .dim {
      opacity: 0.5;
    }
    .error {
      color: #d33;
    }
    input.invalid {
      outline: 2px solid #d33;
    }
    </style>
    <script type="module" src="./bundle.js"></script>
  </head>
</html>
